<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes q-mic-pulse{0%{box-shadow:0 0 0 0 rgba(253,209,13,.55)}100%{box-shadow:0 0 0 14px rgba(253,209,13,0)}}
@keyframes q-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes q-halo{0%{transform:scale(1);opacity:.5}70%{transform:scale(1.7);opacity:0}100%{transform:scale(1.7);opacity:0}}
@keyframes q-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes q-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes q-twitch{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-14deg)}96%{transform:rotate(10deg)}}
@keyframes q-blink{0%,44%,56%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
body{margin:0}
a{color:#FDD10D}a:hover{color:#FFE14D}
</style>
</helmet>
<div style="width:100%;pointer-events:none;display:flex;align-items:center;justify-content:flex-end;box-sizing:border-box;font-family:Ubuntu,system-ui,sans-serif">
  <div style="pointer-events:auto;width:{{ barWidth }};max-width:100%;height:90px;box-sizing:border-box;border:1.5px solid rgba(255,255,255,.9);border-radius:45px;background:rgba(14,15,19,.82);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);display:flex;align-items:center;gap:12px;padding:0 9px 0 {{ padLeft }};overflow:hidden;isolation:isolate;box-shadow:0 0 0 1px rgba(255,255,255,.3),0 0 14px rgba(255,255,255,.55),0 0 32px rgba(255,255,255,.25),0 1px 0 rgba(255,255,255,.25) inset,0 -2px 6px rgba(0,0,0,.35) inset,0 2px 4px rgba(0,0,0,.25),0 10px 18px -4px rgba(0,0,0,.35),0 28px 48px -12px rgba(0,0,0,.55);animation:{{ floatAnim }};transition:width .48s cubic-bezier(.22,1,.36,1),padding .48s cubic-bezier(.22,1,.36,1)">
    <sc-if value="{{ open }}">
      <input ref="{{ inputRef }}" value="{{ draft }}" onChange="{{ onDraft }}" onKeyDown="{{ onKey }}" placeholder="{{ placeholderText }}" style="flex:1;min-width:0;border:0;outline:none;background:transparent;font-family:inherit;font-size:20px;color:#FFFFFF">
    </sc-if>
    <sc-if value="{{ micOn }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ onMic }}" aria-label="{{ micLabel }}" style="flex:0 0 auto;width:60px;height:60px;border-radius:50%;border:0;background:{{ micBg }};color:{{ micInk }};display:grid;place-items:center;cursor:pointer;padding:0;animation:{{ micAnim }}" style-active="transform:scale(.92)">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
      </button>
    </sc-if>
    <sc-if value="{{ canSend }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ onSend }}" aria-label="Send" style="flex:0 0 auto;width:60px;height:60px;border-radius:50%;border:0;background:#FDD10D;color:#0B0620;display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 4px 12px -4px rgba(253,209,13,.6)" style-active="transform:scale(.92)">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"></path><path d="M5 12l7-7 7 7"></path></svg>
      </button>
    </sc-if>
    <button onClick="{{ onToggle }}" onMouseEnter="{{ onBotEnter }}" onMouseLeave="{{ onBotLeave }}" onFocus="{{ onBotEnter }}" onBlur="{{ onBotLeave }}" aria-label="{{ buttonLabel }}" style="position:relative;flex:0 0 auto;width:60px;height:60px;margin:0 6px;border-radius:50%;border:0;padding:0;background:#FFFFFF;box-shadow:0 0 10px rgba(255,255,255,.9),0 0 22px rgba(255,255,255,.6),0 0 44px rgba(255,255,255,.3);display:grid;place-items:center;cursor:pointer;animation:{{ pulse }};transition:box-shadow .3s cubic-bezier(.33,1,.68,1)" style-hover="box-shadow:0 0 14px #FFFFFF,0 0 30px rgba(255,255,255,.8),0 0 60px rgba(255,255,255,.45)">
      <span style="position:absolute;inset:0;border-radius:50%;background:#FFFFFF;animation:{{ halo }};pointer-events:none"></span>
      <span style="position:relative;display:grid;place-items:center;transform:scale(1.5)">{{ botFace }}</span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:120},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ask Q1 anything&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;buttonLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ask Q1&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;voice&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;float&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;closeOnSubmit&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;speechLang&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;en-ZA&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onSubmit&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(text: string) =&gt; void&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { open:false, draft:'', listening:false, hover:false, hoverMood:'excited', mood:0 };
  inputRef = React.createRef();
  componentDidMount(){
    const tick=()=>{ this._t=setTimeout(()=>{ this.setState(st=>{ let n; do{ n=Math.floor(Math.random()*8); }while(n===st.mood); return {mood:n}; }); tick(); },1600+Math.random()*2200); };
    tick();
  }
  componentWillUnmount(){ clearTimeout(this._t); clearInterval(this._hovT); try{ this._rec&&this._rec.stop(); }catch(e){} }
  componentDidUpdate(pp,ps){ if(this.state.open&&!ps.open) setTimeout(()=>{ try{ this.inputRef.current&&this.inputRef.current.focus(); }catch(e){} },120); }
  submit(text){
    const q=(text||'').trim(); if(!q) return;
    this.setState({draft:''});
    if(this.props.onSubmit) this.props.onSubmit(q);
    if(this.props.closeOnSubmit!==false) this.setState({open:false});
  }
  toggleMic(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return;
    if(this.state.listening){ try{ this._rec&&this._rec.stop(); }catch(e){} return; }
    const r=new SR(); this._rec=r; r.lang=this.props.speechLang||'en-ZA'; r.interimResults=true; r.maxAlternatives=1;
    let fin='';
    r.onresult=e=>{ let t=''; for(let i=0;i<e.results.length;i++){ t+=e.results[i][0].transcript; if(e.results[i].isFinal) fin=t; } this.setState({draft:t}); };
    r.onerror=()=>this.setState({listening:false});
    r.onend=()=>{ this.setState({listening:false}); this.submit(fin||this.state.draft); };
    this.setState({listening:true,draft:''}); try{ r.start(); }catch(e){ this.setState({listening:false}); }
  }
  botFace(){
    const hv=this.state.hover;
    const m=hv?this.state.hoverMood:['idle','side','bored','wink','attitude','happy','idle','sus'][this.state.mood||0];
    const E=React.createElement, T='all .32s cubic-bezier(.34,1.56,.64,1)';
    const eye=side=>{ const L=side<0;
      const c={idle:{w:4,h:7,x:0,y:0,r:0,rad:2},side:{w:4,h:7,x:2.5,y:0,r:0,rad:2},bored:{w:6,h:2.5,x:0,y:1.5,r:0,rad:1.5},
        wink:L?{w:6,h:2,x:0,y:1.5,r:-8,rad:1}:{w:4,h:7,x:0,y:0,r:0,rad:2},attitude:{w:6,h:4,x:0,y:1,r:L?18:-18,rad:1.5},
        happy:{w:6,h:3.5,x:0,y:0,r:0,rad:'4px 4px 1px 1px'},sus:L?{w:6,h:2.5,x:1.5,y:1,r:0,rad:1.5}:{w:4.5,h:6,x:1.5,y:0,r:0,rad:2},
        excited:{w:5,h:5,x:0,y:-.5,r:0,rad:'50%'},surprised:{w:5,h:8,x:0,y:-.5,r:0,rad:'50%'},shy:{w:5,h:2.5,x:0,y:2,r:L?-10:10,rad:'4px 4px 1px 1px'},
        love:{w:4.5,h:4.5,x:0,y:0,r:45,rad:'2px 2px 0 2px',c:'#FF6B9A'},cheeky:L?{w:6,h:3.5,x:0,y:0,r:0,rad:'4px 4px 1px 1px'}:{w:6,h:2,x:0,y:1.5,r:-8,rad:1}}[m];
      return E('span',{key:'e'+side,style:{display:'block',width:c.w+'px',height:c.h+'px',borderRadius:typeof c.rad==='number'?c.rad+'px':c.rad,background:c.c||'#FDD10D',
        transform:'translate('+c.x+'px,'+c.y+'px) rotate('+c.r+'deg)',transition:T,animation:(m==='idle'||m==='side')?'q-blink 3.2s '+(side>0?'.04s':'0s')+' infinite':'none'}}); };
    const mo={idle:{w:5,h:1.6,r:0,y:0},side:{w:3,h:1.6,r:0,y:0},bored:{w:6,h:1.4,r:0,y:0},wink:{w:5,h:1.6,r:-14,y:0},attitude:{w:5,h:1.6,r:8,y:.5},
      happy:{w:7,h:3,r:0,y:0,rad:'1px 1px 4px 4px'},sus:{w:4,h:1.6,r:-10,y:0},excited:{w:8,h:4,r:0,y:0,rad:'1px 1px 5px 5px'},surprised:{w:4,h:4,r:0,y:.5,rad:'50%'},
      shy:{w:4,h:1.6,r:0,y:.5},love:{w:6,h:3,r:0,y:0,rad:'1px 1px 4px 4px'},cheeky:{w:6,h:3,r:-12,y:0,rad:'1px 1px 4px 4px'}}[m];
    const tilt={idle:0,side:-8,bored:6,wink:-6,attitude:10,happy:0,sus:-12,excited:0,surprised:0,shy:-10,love:6,cheeky:-8}[m];
    return E('span',{style:{position:'relative',width:'28px',height:'28px',display:'grid',placeItems:'center',animation:hv?'q-bob .6s ease-in-out infinite':'q-bob 2.4s ease-in-out infinite',transform:hv?'scale(1.14)':'scale(1)',transition:'transform .35s cubic-bezier(.34,1.56,.64,1)'}},
      E('span',{key:'ant',style:{position:'absolute',top:'-4px',left:'50%',width:'2px',height:'5px',marginLeft:'-1px',background:'#0B0620',borderRadius:'1px',transformOrigin:'50% 100%',animation:'q-twitch 3.6s ease-in-out infinite'}},
        E('span',{style:{position:'absolute',top:'-3px',left:'-1.5px',width:'5px',height:'5px',borderRadius:'50%',background:m==='attitude'?'#FF5A4F':m==='love'?'#FF6B9A':hv?'#FDD10D':'#0B0620',transition:'background .3s'}})),
      (m==='shy'||m==='love')?E('span',{key:'blush',style:{position:'absolute',left:'2px',right:'2px',top:'15px',display:'flex',justifyContent:'space-between',zIndex:2,pointerEvents:'none'}},
        E('span',{style:{width:'5px',height:'3px',borderRadius:'50%',background:'rgba(255,107,154,.85)'}}),E('span',{style:{width:'5px',height:'3px',borderRadius:'50%',background:'rgba(255,107,154,.85)'}})):null,
      E('span',{key:'head',style:{width:'26px',height:'22px',borderRadius:'9px',background:'#0B0620',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'3px',transform:'rotate('+tilt+'deg)',transition:T,boxShadow:'inset 0 -2px 0 rgba(255,255,255,.08)'}},
        E('span',{key:'eyes',style:{display:'flex',alignItems:'center',gap:'5px',height:'7px'}},eye(-1),eye(1)),
        E('span',{key:'mouth',style:{display:'block',width:mo.w+'px',height:mo.h+'px',borderRadius:mo.rad||'1px',background:'#FDD10D',opacity:.85,transform:'translateY('+mo.y+'px) rotate('+mo.r+'deg)',transition:T}})));
  }
  renderVals(){
    const s=this.state, p=this.props, has=!!(s.draft||'').trim();
    const srOk=typeof window!=='undefined'&&!!(window.SpeechRecognition||window.webkitSpeechRecognition);
    return {
      open:s.open, draft:s.draft, inputRef:this.inputRef,
      barWidth:s.open?'100%':'90px', padLeft:s.open?'30px':'9px',
      floatAnim:p.float===false?'none':'q-float 4.2s ease-in-out infinite',
      placeholderText:s.listening?'Listening…':(p.placeholder??'Ask Q1 anything'),
      buttonLabel:p.buttonLabel??'Ask Q1',
      micOn:s.open&&p.voice!==false&&srOk&&(s.listening||!has),
      micLabel:s.listening?'Stop listening':'Speak',
      micBg:s.listening?'#FDD10D':'rgba(255,255,255,.08)', micInk:s.listening?'#0B0620':'#FFFFFF',
      micAnim:s.listening?'q-mic-pulse 1.1s cubic-bezier(.33,1,.68,1) infinite':'none',
      canSend:s.open&&has,
      pulse:s.open?'none':'q-breathe 3.6s ease-in-out infinite',
      halo:s.open?'none':'q-halo 3.6s ease-out infinite',
      botFace:this.botFace(),
      onDraft:e=>this.setState({draft:e.target.value}),
      onKey:e=>{ if(e.key==='Enter') this.submit(this.state.draft); if(e.key==='Escape') this.setState({open:false,draft:''}); },
      onSend:()=>this.submit(this.state.draft),
      onMic:()=>this.toggleMic(),
      onToggle:()=>{ if(!this.state.open){ this.setState({open:true}); p.onOpen&&p.onOpen(); return; }
        if((this.state.draft||'').trim()) return this.submit(this.state.draft);
        this.setState({open:false}); p.onClose&&p.onClose(); },
      onBotEnter:()=>{ const M=['excited','surprised','shy','love','cheeky']; const pick=()=>{ let n; do{ n=M[Math.floor(Math.random()*M.length)]; }while(n===this.state.hoverMood); return n; };
        clearInterval(this._hovT); this.setState({hover:true,hoverMood:pick()}); this._hovT=setInterval(()=>this.setState({hoverMood:pick()}),1100); },
      onBotLeave:()=>{ clearInterval(this._hovT); this.setState({hover:false}); }
    };
  }
}
</script>
</body>
</html>
